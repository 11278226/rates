name: Daily Mortgage Scraper

# This tells GitHub WHEN to run the script
on:
  schedule:
    # Runs at 07:17 UTC on the default branch
    - cron: '17 7 * * *'
  workflow_dispatch: # This adds a manual "Run Workflow" button on GitHub so you can test it anytime

# Gives the script permission to save the JSON file back to the repo
permissions:
  contents: write

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps # Installs Linux system dependencies required by Playwright

      - name: Run the scraper script
        run: python scrape_rates.py # Make sure this matches your exact python file name!

      - name: Commit and push the updated JSON
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"
          git add hypotheker_products_complete.json # Make sure this matches your JSON file name!
          # If the data hasn't changed, git commit will fail. "|| exit 0" prevents the action from crashing if rates are the same.
          git commit -m "Auto-update mortgage rates" || exit 0
          git push
